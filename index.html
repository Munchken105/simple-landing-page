<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <Title>WcDonald</Title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <div class="page">
        
        <div class="top">
            <div class="header">
                <div class="left-side">
                    <img class="header-logo" src="images/WcDonald_s_Logo.jpg" alt="WcDonald_Logo">
                </div>
                <div class="right-side"> 
                    <ul>
                        <a href="#">Home</a>
                        <a href="#">Meals</a>
                        <a href="#">Deals</a>
                    </ul>
                </div>
            </div>

            <div class="top-content">
                <div class="left-side-top-content">
                    <p class="title-top-content">This is WcDonald's</p>
                    <p>boom bam bop wcdonalds</p>
                    <button>Sign Up</button>
                </div>
                
                    <div class="top-content-image-right">
                        <img class="mcchicken" src="images/mcchicken.png" alt="mcchicken">
                    </div>
                </div>        
            </div>
            
            <div class="middle">
                <div class="middle-info">
                    <div class="meals">
                        <p class="meals-title">Wcdonalds Meals</p>
                    </div>
                    <div class="info">
                        <ul>
                            <div class="info-1">
                                <img class="mcchicken-meal" src="images/Mcchicken-meal.webp" alt="mcchicken meal"></img>
                                <p>Wchichken Meal deal 3.99$</p>
                            </div>
                            
                            <div class="info-2">
                                <img class="big-wac-meal" src="images/big-mac-meal.webp" alt="big-wac-meal">
                                <p>Big Wac Meal 14.99$</p>
                            </div>

                            <div class="info-3">
                                <img class="wcsasuage-meal" src="images/DC_202603_3655_EVM_HB_SausageEggMcMuffin_1564x1564.webp" alt="sausage McMuffin egg meal">
                                <p>WcSasuage Meal 6.99$</p>
                            </div>

                            <div class="info-4">
                                <img class="spicy-snack-wrap-meal" src="images/Spicy-Snack-Wrap.webp" alt="Snack-wrap-meal">
                                <p>Spicy Snack Wrap Meal Deal 10.00$</p>
                            </div>
                        </ul>
                    </div>

                    <div class="quote">
                        <p class="big-quote">I Love WcChicken it's so tasty and juicy</p>
                        <p class="small-quote">-Friren the Slayer</p>
                    </div>


                </div>
            </div>



        <div class="footer">
            <p>WcDonald's</p>
        </div>
    </div>  
</body>
